name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: VPS configuration tests
        run: pnpm test:vps-config

      - name: Guided deployment and administrator bootstrap tests
        run: pnpm test:deploy

      - name: Shell script syntax
        run: bash -n scripts/deploy.sh scripts/server-report.sh

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Start Supabase and apply migrations
        run: supabase start

      - name: Start antivirus
        run: docker compose -f compose.antivirus.yaml up -d --wait --wait-timeout 600

      - name: Export local Supabase environment
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Static checks
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Backup integrity tests
        run: pnpm test:backup

      - name: Backup maintenance failure tests
        run: pnpm test:backup-cycle

      - name: Real antivirus integration
        run: pnpm test:av

      - name: Database tests
        run: pnpm test:db

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

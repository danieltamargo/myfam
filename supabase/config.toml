
[functions.delete-account]
enabled = true
# auth.getUser(token) in the handler verifies current signing keys before any mutation.
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]

[auth]
site_url = "http://localhost:5173"
enable_signup = false
minimum_password_length = 12
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/*",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/reset-password",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/reset-password",
  "http://127.0.0.1:3300/auth/callback",
  "http://127.0.0.1:3300/reset-password"
]

[auth.rate_limit]
email_sent = 20
token_refresh = 60
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 1800

[auth.email.template.invite]
subject = "Tu acceso a MyFamily · Your MyFamily invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirma tu correo · Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña · Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
